name: Build indexable chapter pages
on:
  push:
    branches: [main]
    paths:
      - 'data/*.json'
      - 'latest-chapters.html'
      - 'scripts/build-chapter-pages.js'
      - '.github/workflows/build-chapter-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static chapter pages
        run: node scripts/build-chapter-pages.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sitemap.xml latest-chapters.html
          if [ -d chapters ]; then git add -A -- chapters; fi
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate indexable static chapter pages"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after syncing main."
              sleep 2
            done
            echo "Unable to push generated SEO files after 3 attempts."
            exit 1
          fi
