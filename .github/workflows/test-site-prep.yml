name: Prepare MangaGoAtlas chapter-free site
on:
  push:
    branches:
      - chatgpt/mangogoatlas-chapter-free-setup-2026-10-24
    paths:
      - '.github/workflows/test-site-prep.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mangogoatlas-chapter-free-setup-2026-10-24
      - name: Extract and prepare site
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 'MangaGoAtlas-Site-No-Chapters (5).zip' -d /tmp/mga
          test -d /tmp/mga/MangaGoAtlas
          cp -a /tmp/mga/MangaGoAtlas/. .
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('index.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            s,n=re.subn(r'<main id="app" class="section">.*?</main>', '<main id="app" class="section"><div class="empty">No latest chapters found.</div></main>', s, count=1, flags=re.S)
            if n:
              if '.empty{' not in s: s=s.replace('</style>', '.empty{padding:32px;border:1px dashed #303340;border-radius:12px;color:#9296a5;text-align:center}</style>',1)
              p.write_text(s,encoding='utf-8')
          p=Path('latest-chapters.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            s,n=re.subn(r'<div class="static-list" aria-label="Latest manga chapter links">.*?</div>', '<div class="static-list empty" aria-label="Latest manga chapter links">No chapters published yet. New listings will appear here when available.</div>', s, count=1, flags=re.S)
            if n: p.write_text(s,encoding='utf-8')
          p=Path('data/ads-config.json')
          if p.exists():
            cfg=json.loads(p.read_text(encoding='utf-8'))
            for section in cfg.get('sections',[]): section['enabled']=False
            p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('seo-system.js')
          if p.exists(): p.write_text(p.read_text(encoding='utf-8').replace('https://mangaatlas.github.io','https://mangogoatlas.github.io'),encoding='utf-8')
          p=Path('vercel.json')
          if p.exists():
            cfg=json.loads(p.read_text(encoding='utf-8'))
            cfg['rewrites']=[x for x in cfg.get('rewrites',[]) if x.get('source')!='/sitemap.xml']
            p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for name in ('manual-chapters.json','upcoming-chapters.json','extra-chapters.json'):
            p=Path('data')/name
            if not p.exists(): p.write_text('{\n  "version": 1,\n  "chapters": []\n}\n',encoding='utf-8')
          for name in ('admin/index.html','admin/manga.html','admin/chapters.html','admin/ads-v3.html'):
            p=Path(name)
            if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r"\\b(OWNER|O)='MangaGoAtlas'",r"\\1='MangaNewWorld'",s)
              s=re.sub(r"\\b(REPO|R)='MangaGoAtlas\\.github\\.io'",r"\\1='MangaNewWorld.github.io'",s)
              p.write_text(s,encoding='utf-8')
          for name in ('.github/workflows/extract-nonimage-site.yml','.github/workflows/fix-admin-ads.yml'):
            p=Path(name)
            if p.exists(): p.rename(p.with_suffix(p.suffix+'.disabled'))
          PY
          node scripts/build-chapter-pages.js
          git add -A
          # The connected GitHub App cannot push workflow-file changes; keep those unstaged.
          git reset -- .github/workflows
          if git diff --cached --quiet; then echo 'No site changes detected'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare chapter-free MangaGoAtlas site'
          git push origin HEAD:chatgpt/mangogoatlas-chapter-free-setup-2026-10-24
