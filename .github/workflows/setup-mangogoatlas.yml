name: Prepare MangaGoAtlas chapter-free site

on:
  push:
    branches:
      - chatgpt/mangogoatlas-chapter-free-setup-2026-10-24
    paths:
      - '.github/workflows/setup-mangogoatlas.yml'

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mangogoatlas-chapter-free-setup-2026-10-24

      - name: Extract site and apply chapter-free fixes
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='MangaGoAtlas-Site-No-Chapters (5).zip'
          test -f "$ARCHIVE"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$ARCHIVE" -d "$TMP"
          test -d "$TMP/MangaGoAtlas"
          cp -a "$TMP/MangaGoAtlas/." .

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          # Homepage: remove stale hard-coded chapter links while preserving the design.
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r'<main id="app" class="section">.*?</main>',
              '<main id="app" class="section"><div class="empty">No latest chapters found.</div></main>',
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not safely locate the homepage chapter block")
          if ".empty{" not in s:
              s = s.replace("</style>", ".empty{padding:32px;border:1px dashed #303340;border-radius:12px;color:#9296a5;text-align:center}</style>", 1)
          p.write_text(s, encoding="utf-8")

          # Latest-chapters page: replace obsolete links with a graceful empty state.
          p = Path("latest-chapters.html")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(
              r'<div class="static-list" aria-label="Latest manga chapter links">.*?</div>',
              '<div class="static-list empty" aria-label="Latest manga chapter links">No chapters published yet. New listings will appear here when available.</div>',
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not safely locate the stale latest-chapters list")
          p.write_text(s, encoding="utf-8")

          # Disable saved ad sections without deleting their code/configuration.
          p = Path("data/ads-config.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          for section in cfg.get("sections", []):
              section["enabled"] = False
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Canonical base domain used by the existing SEO layer.
          p = Path("seo-system.js")
          p.write_text(p.read_text(encoding="utf-8").replace(
              "https://mangaatlas.github.io", "https://mangogoatlas.github.io"), encoding="utf-8")

          # Do not rewrite sitemap requests to a missing /api/sitemap endpoint.
          p = Path("vercel.json")
          config = json.loads(p.read_text(encoding="utf-8"))
          config["rewrites"] = [r for r in config.get("rewrites", []) if r.get("source") != "/sitemap.xml"]
          p.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # No chapter URLs are published while all chapter sources are empty.
          urls = [
              "https://mangogoatlas.github.io/",
              "https://mangogoatlas.github.io/latest-chapters.html",
              "https://mangogoatlas.github.io/manga.html",
              "https://mangogoatlas.github.io/country.html",
              "https://mangogoatlas.github.io/japan-blog.html",
              "https://mangogoatlas.github.io/blog.html",
          ]
          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n'
          sitemap += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          sitemap += "".join("  <url><loc>" + u + "</loc></url>\n" for u in urls)
          sitemap += "</urlset>\n"
          Path("sitemap.xml").write_text(sitemap, encoding="utf-8")

          # Missing optional chapter-source files should not stop the static build.
          p = Path("scripts/build-chapter-pages.js")
          s = p.read_text(encoding="utf-8")
          old = "const readJson=(p)=>JSON.parse(fs.readFileSync(path.join(root,p),'utf8'));"
          new = """const readJson=(p,fallback={})=>{
            try { return JSON.parse(fs.readFileSync(path.join(root,p),'utf8')); }
            catch (err) { if (err && err.code === 'ENOENT') return fallback; throw err; }
          };"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "const readJson=(p,fallback={})=>" not in s:
              raise SystemExit("Could not safely patch chapter build JSON reader")
          p.write_text(s, encoding="utf-8")

          for name in ("manual-chapters.json", "upcoming-chapters.json", "extra-chapters.json"):
              p = Path("data") / name
              if not p.exists():
                  p.write_text('{\n  "version": 1,\n  "chapters": []\n}\n', encoding="utf-8")

          # The selected target repository is now confirmed by the owner.
          for name in ("admin/index.html", "admin/manga.html", "admin/chapters.html", "admin/ads-v3.html"):
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              s = re.sub(r"\b(OWNER|O)='MangaGoAtlas'", r"\1='MangaNewWorld'", s)
              s = re.sub(r"\b(REPO|R)='MangaGoAtlas\.github\.io'", r"\1='MangaNewWorld.github.io'", s)
              p.write_text(s, encoding="utf-8")

          # Keep problematic one-off workflows as reference, but prevent them from
          # running automatically: one expects a different ZIP and the other would
          # overwrite the confirmed admin repository target.
          for name in (
              ".github/workflows/extract-nonimage-site.yml",
              ".github/workflows/fix-admin-ads.yml",
          ):
              p = Path(name)
              if p.exists():
                  p.rename(p.with_suffix(p.suffix + ".disabled"))

          Path("README.md").write_text("""# MangaGoAtlas

A static manga discovery site built with HTML, CSS, JavaScript, and JSON data. The chapter-free setup intentionally contains no published chapter records, generated chapter pages, or chapter images. Existing manga records and available cover images are retained.

## Project structure

- Public HTML pages include the homepage, manga and country pages, latest chapters, and blog pages.
- `data/content.json` retains the manga catalog; its chapter list is empty.
- `data/manual-chapters.json`, `data/upcoming-chapters.json`, and `data/extra-chapters.json` are empty chapter sources.
- `manga-covers/` contains the preserved cover images.
- `admin/` contains GitHub-backed manga, chapter, and ad management pages.
- `data/ads-config.json` retains nine ad sections and their saved code, with every section disabled.
- `scripts/build-chapter-pages.js` builds static chapter pages when authorized chapter data is later added.
- `supabase/schema.sql` is retained as a schema reference; the current HTML admin uses the GitHub Contents API rather than Supabase authentication.

## Local checks

Use Node.js 20 or newer:

```sh
node --check homepage-system.js
node --check chapter-navigation.js
node --check chapter-enhancements.js
node scripts/build-chapter-pages.js
```

The chapter-page build tolerates missing optional JSON sources. With all chapter arrays empty, it should generate zero chapter pages and a sitemap without chapter URLs.

## Deployment

The site can be deployed as static files on GitHub Pages or Vercel. The checked-in `sitemap.xml` is served as a static file; the Vercel rewrite to a missing `/api/sitemap` endpoint has been removed.

The canonical URLs still use `https://mangogoatlas.github.io`. Confirm that this remains the intended public domain before deployment. Some cover URLs also point to a separate `MangaAtlas` repository and were preserved rather than rewritten to unknown files.

## Admin access

The admin pages are configured to read and write this repository: `MangaNewWorld/MangaNewWorld.github.io`, using the `main` branch. They require a GitHub token with repository contents read/write access and keep it in browser `sessionStorage` for the current session. Never put a token in source code or commit it.

The admin target was updated for this repository, but an authenticated admin write has not been tested. Verify access using a token with the minimum necessary permissions before relying on it.

## Adding chapters later

Authorized editors can add chapter records through Chapters Admin. Chapter images are not included in this cleanup and should only be uploaded when you intentionally publish new content. Once chapter records are added, run `node scripts/build-chapter-pages.js` to regenerate chapter pages and the sitemap.
""", encoding="utf-8")
          PY

      - name: Validate source files and empty chapter state
        shell: bash
        run: |
          set -euo pipefail
          node --check homepage-system.js
          node --check chapter-navigation.js
          node --check chapter-enhancements.js
          node --check scripts/build-chapter-pages.js
          node --check latest-chapters.js
          node --check seo-system.js
          node - <<'JS'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('data/content.json','utf8'));
          if(!Array.isArray(content.mangas) || content.mangas.length!==16) throw new Error('Expected 16 manga records');
          if(!Array.isArray(content.chapters) || content.chapters.length!==0) throw new Error('Expected empty main chapter list');
          for(const p of ['data/manual-chapters.json','data/upcoming-chapters.json','data/extra-chapters.json']) {
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!Array.isArray(d.chapters) || d.chapters.length!==0) throw new Error('Expected empty chapter source: '+p);
          }
          const ads=JSON.parse(fs.readFileSync('data/ads-config.json','utf8'));
          if(!Array.isArray(ads.sections) || ads.sections.length!==9 || ads.sections.some(x=>x.enabled!==false)) throw new Error('Ad sections must remain disabled');
          const xml=fs.readFileSync('sitemap.xml','utf8');
          if((xml.match(/<loc>/g)||[]).length!==6 || /chapter\.html\?slug=/.test(xml)) throw new Error('Sitemap should contain only six non-chapter URLs');
          console.log('Validation passed: manga catalog preserved, all chapter sources empty, ads disabled, sitemap chapter-free.');
          JS
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          json.loads(pathlib.Path('vercel.json').read_text())
          for p in pathlib.Path('data').glob('*.json'): json.loads(p.read_text())
          ET.parse('sitemap.xml')
          # Ensure every image file is a cover and there are no generated chapter pages.
          covers=[p for p in pathlib.Path('manga-covers').rglob('*') if p.is_file()]
          if len(covers)!=14: raise SystemExit(f'Expected 14 cover files, got {len(covers)}')
          if pathlib.Path('chapters').exists(): raise SystemExit('Unexpected generated chapter directory')
          # Verify admin targets match the selected repository.
          for n in ('admin/index.html','admin/manga.html','admin/chapters.html','admin/ads-v3.html'):
              s=pathlib.Path(n).read_text()
              if 'MangaNewWorld.github.io' not in s or 'MangaGoAtlas.github.io' in s:
                  raise SystemExit(f'Admin repository target not updated: {n}')
          print('JSON, XML, covers, and admin-target checks passed.')
          PY

      - name: Remove temporary setup workflow and commit extracted site
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/setup-mangogoatlas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add chapter-free MangaGoAtlas site at repository root"
          git push origin HEAD:chatgpt/mangogoatlas-chapter-free-setup-2026-10-24
