<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaGoAtlas Chapters</title><style>body{margin:0;background:#08090d;color:#eee;font:15px system-ui}.w{max-width:1000px;margin:auto;padding:20px}.nav a{color:#fff;margin-right:12px}.box{background:#11131a;border:1px solid #303644;border-radius:10px;padding:15px;margin:14px 0}input,select,button{padding:9px;border-radius:7px;border:1px solid #343a48;background:#090b10;color:#fff}button{background:#3f73c9;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #303644;padding:10px;margin:7px 0;display:flex;justify-content:space-between;gap:10px}.danger{background:#a73535}.hide{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="nav"><a href="/admin/">Dashboard</a><a href="manga.html">Manga</a><a href="ads.html">Ads</a><a href="/">Site</a></div><h1>📚 Chapters Admin</h1><div id="login" class="box"><input id="token" type="password" placeholder="GitHub token" style="width:70%"><button id="connect">Connect</button><p id="msg"></p></div><div id="app" class="hide"><div class="box"><label>Manga</label><select id="manga" style="width:100%"></select><br><br><button id="add">＋ Add chapter</button> <button id="logout">Forget token</button></div><div id="list" class="box"></div><div id="edit" class="box hide"><h2 id="eh">Add chapter</h2><div class="row"><div><label>Chapter number</label><input id="num" type="number" style="width:100%"></div><div><label>Title</label><input id="title" style="width:100%"></div><div><label>Slug</label><input id="slug" style="width:100%"></div><div><label>Images</label><input id="files" type="file" multiple accept="image/*"></div></div><p><button id="save">Save chapter</button> <button id="upload">Upload images</button> <button id="del" class="danger">Delete</button> <button id="cancel">Cancel</button></p><p id="status"></p></div></div></div><script>'use strict';const K='mangogoatlas_github_token',O='MangaGoAtlas',R='MangaGoAtlas.github.io',B='main',P='data/content.json',M='data/manual-chapters.json';let token=sessionStorage.getItem(K)||'',data,manual,editing=null,isManual=false;const $=x=>document.getElementById(x);const b64=s=>{const u=new TextEncoder().encode(s);let z='';for(let i=0;i<u.length;i+=32768)z+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(z)};const dec=s=>{const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))};async function api(p,o={}){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+p,{...o,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json',...(o.headers||{})},cache:'no-store'});const t=await r.text();let x={};try{x=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error('GitHub '+r.status+': '+(x.message||t));return x}async function rf(p){const x=await api('/contents/'+p+'?ref='+B);return{v:JSON.parse(dec(x.content)),sha:x.sha}}async function wf(p,v,sha,msg){return(await api('/contents/'+p,{method:'PUT',body:JSON.stringify({message:msg,content:b64(JSON.stringify(v,null,2)+'\n'),sha,branch:B})})).content.sha}async function load(){let x=await rf(P);data=x.v;data.mangas=data.mangas||[];data.chapters=data.chapters||[];try{x=await rf(M);manual=x.v;manual.chapters=manual.chapters||[]}catch{manual={version:1,chapters:[]}}render()}function mid(c){return c.mangaId||c.manga_id||c.seriesId||c.series_id}function chapters(){const id=$('manga').value,a=data.chapters.filter(c=>mid(c)===id).map(c=>({...c,man:false}));for(const c of manual.chapters)if(mid(c)===id&&!a.some(x=>x.slug===c.slug))a.push({...c,man:true});return a.sort((a,b)=>(+b.number||0)-(+a.number||0))}function render(){const old=$('manga').value;$('manga').innerHTML=data.mangas.map(m=>'<option value="'+m.id+'">'+(m.title||m.id)+'</option>').join('');if(data.mangas.some(m=>m.id===old))$('manga').value=old;const a=chapters();$('list').innerHTML='<h2>'+a.length+' chapters</h2>'+a.map(c=>'<div class="item"><span><b>'+c.title+'</b><br>Chapter '+c.number+' · '+c.slug+' · '+(c.pages||[]).length+' pages</span><span><button onclick="editC(\''+encodeURIComponent(c.slug)+'\','+c.man+')">Edit</button> <button class="danger" onclick="deleteC(\''+encodeURIComponent(c.slug)+'\','+c.man+')">Delete</button></span></div>').join('')||'No chapters.'}function openAdd(){const m=data.mangas.find(x=>x.id===$('manga').value);if(!m)return;editing=null;isManual=true;$('eh').textContent='Add chapter';$('num').value='';$('title').value='';$('slug').value=(m.slug||m.id)+'-raw-';$('edit').classList.remove('hide');$('del').classList.add('hide')}window.editC=(key,man)=>{const s=decodeURIComponent(key),c=man?manual.chapters.find(x=>x.slug===s):data.chapters.find(x=>x.slug===s);if(!c)return;editing={...c};isManual=man;$('eh').textContent='Edit chapter';$('num').value=c.number||'';$('title').value=c.title||'';$('slug').value=c.slug||'';$('edit').classList.remove('hide');$('del').classList.remove('hide')};$('connect').onclick=async()=>{token=$('token').value.trim();if(!token)return;try{await api('/contents/'+P+'?ref='+B);sessionStorage.setItem(K,token);$('login').classList.add('hide');$('app').classList.remove('hide');await load();$('msg').textContent='✓ Connected to MangaGoAtlas.'}catch(e){$('msg').textContent='Connection failed: '+e.message}};$('logout').onclick=()=>{sessionStorage.removeItem(K);location.reload()};$('add').onclick=openAdd;$('manga').onchange=render;$('cancel').onclick=()=>{$('edit').classList.add('hide')};$('save').onclick=async()=>{try{const m=data.mangas.find(x=>x.id===$('manga').value),num=+$('num').value,title=$('title').value.trim(),slug=$('slug').value.trim();if(!m||!num||!title||!slug)throw Error('Manga, chapter number, title and slug are required.');const now=new Date().toISOString();if(editing){const p=isManual?M:P,x=await rf(p),c=x.v.chapters.find(z=>z.id===editing.id||z.slug===editing.slug);if(!c)throw Error('Chapter not found.');Object.assign(c,{mangaId:m.id,number:num,title,slug,updatedAt:now});if(!isManual)c.updated_at=now;await wf(p,x.v,x.sha,'Update chapter '+slug)}else{const x=await rf(M);x.v.chapters=x.v.chapters||[];if([...data.chapters,...manual.chapters].some(c=>c.slug===slug))throw Error('Slug already exists.');x.v.chapters.push({id:'manual-'+Date.now(),mangaId:m.id,number:num,title,slug,country:'JP',pages:[],createdAt:now,updatedAt:now});await wf(M,x.v,x.sha,'Add chapter '+slug)}await load();$('status').textContent='✓ Chapter saved.'}catch(e){$('status').textContent=e.message}};window.deleteC=async(key,man)=>{if(!confirm('Delete this chapter record?'))return;try{const s=decodeURIComponent(key),p=man?M:P,x=await rf(p);x.v.chapters=x.v.chapters.filter(c=>c.slug!==s);await wf(p,x.v,x.sha,'Delete chapter '+s);await load();$('status').textContent='✓ Deleted.'}catch(e){$('status').textContent=e.message}};$('upload').onclick=async()=>{try{if(!editing)throw Error('Save the chapter first.');const fs=[...$('files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!fs.length)throw Error('Select images.');const m=data.mangas.find(x=>x.id===$('manga').value);if(!m)throw Error('Manga not found.');const folder='chapter-images/'+(m.slug||m.id)+'/chapter-'+editing.slug,pages=[];for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>24*1024*1024)throw Error(f.name+' is over 24 MB.');const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});const path=folder+'/'+String(i+1).padStart(4,'0')+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const old=await api('/contents/'+path+'?ref='+B).catch(()=>null),body={message:'Upload chapter image '+editing.slug,content:dataUrl,branch:B};if(old?.sha)body.sha=old.sha;await api('/contents/'+path,{method:'PUT',body:JSON.stringify(body)});pages.push('/'+path);$('status').textContent='Uploaded '+(i+1)+'/'+fs.length+' — saved';}const p=isManual?M:P;let lastErr=null;for(let attempt=1;attempt<=5;attempt++){try{const x=await rf(p),c=x.v.chapters.find(z=>z.id===editing.id||z.slug===editing.slug);if(!c)throw Error('Chapter not found.');c.pages=pages;c.updatedAt=new Date().toISOString();if(!isManual)c.updated_at=c.updatedAt;await wf(p,x.v,x.sha,'Update chapter images '+editing.slug);lastErr=null;break}catch(e){lastErr=e;if(!String(e.message||e).includes('409'))throw e;await new Promise(r=>setTimeout(r,700*attempt));}}if(lastErr)throw lastErr;await load();$('status').textContent='✓ Images uploaded and chapter record updated.'}catch(e){$('status').textContent='Upload failed: '+e.message}};if(token){$('token').value=token;$('connect').click()}</script></body></html>
