<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MangaGoAtlas Ads System</title><style>body{margin:0;background:#08090d;color:#eee;font:15px system-ui}.w{max-width:1000px;margin:auto;padding:20px}.nav a{color:#fff;margin-right:12px}.box{background:#11131a;border:1px solid #303644;border-radius:10px;padding:15px;margin:14px 0}.ad{border:1px solid #303644;padding:14px;margin:10px 0;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea,button{padding:9px;border-radius:7px;border:1px solid #343a48;background:#090b10;color:#fff;font:inherit}textarea{width:100%;min-height:100px}button{background:#3f73c9;font-weight:700}.msg{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="nav"><a href="/admin/">Dashboard</a><a href="chapters.html">Chapters</a><a href="manga.html">Manga</a><a href="/">Site</a></div><h1>📢 Ads System</h1><div class="box"><b>9 independent ad sections</b><p>All public ads are currently disabled. You can keep configuration here without loading ads on the public site.</p><p id="msg" class="msg"></p></div><div id="list"></div><div class="box"><button id="save">Save all Ads to GitHub</button> <button id="reload">Reload</button></div></div><script>'use strict';const K='mangogoatlas_github_token',O='MangaGoAtlas',R='MangaGoAtlas.github.io',B='main',P='data/ads-config.json';let token=sessionStorage.getItem(K)||'',sha='',cfg={version:2,sections:[]};const $=x=>document.getElementById(x),enc=s=>{const u=new TextEncoder().encode(s);let z='';for(let i=0;i<u.length;i+=32768)z+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(z)},dec=s=>{const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))};function defaults(){return Array.from({length:9},(_,i)=>({id:'ad-'+(i+1),name:'Ad Section '+(i+1),enabled:false,code:'',placement:i<3?'start':i<6?'between':'end',between:String(i<3?50:i+2)}))}async function api(p,o={}){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+p,{...o,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json',...(o.headers||{})},cache:'no-store'});const t=await r.text();let x={};try{x=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error('GitHub '+r.status+': '+(x.message||t));return x}async function load(){if(!token){cfg={version:2,sections:defaults()};render();$('msg').textContent='GitHub token required. Connect from Manga or Chapters first.';return}try{const x=await api('/contents/'+P+'?ref='+B);sha=x.sha;cfg=JSON.parse(dec(x.content));if(!Array.isArray(cfg.sections)||cfg.sections.length!==9)cfg.sections=defaults();render();$('msg').textContent='✓ Loaded from MangaGoAtlas repository.'}catch(e){$('msg').textContent='Load failed: '+e.message;cfg={version:2,sections:defaults()};render()}}function render(){if(!cfg.sections.length)cfg.sections=defaults();$('list').innerHTML=cfg.sections.map((a,i)=>'<div class="ad" data-i="'+i+'"><div class="grid"><label>Name<input class="name" value="'+String(a.name||'').replace(/"/g,'&quot;')+'"></label><label><input class="enabled" type="checkbox" '+(a.enabled?'checked':'')+'> Enabled</label></div><label>Placement<select class="placement"><option value="start" '+(a.placement==='start'?'selected':'')+'>Start</option><option value="between" '+(a.placement==='between'?'selected':'')+'>Between images</option><option value="end" '+(a.placement==='end'?'selected':'')+'>End</option></select></label><label>After image number<input class="between" type="number" min="1" max="100" value="'+(a.between||5)+'"></label><label>Ad code<textarea class="code">'+String(a.code||'').replace(/</g,'&lt;')+'</textarea></label></div>').join('')}function collect(){cfg.version=2;cfg.sections=[...document.querySelectorAll('.ad')].map((e,i)=>({id:'ad-'+(i+1),name:e.querySelector('.name').value.trim()||'Ad Section '+(i+1),enabled:e.querySelector('.enabled').checked,code:e.querySelector('.code').value,placement:e.querySelector('.placement').value,between:e.querySelector('.between').value}))}$('save').onclick=async()=>{collect();if(!token){$('msg').textContent='GitHub token required.';return}try{const x=await api('/contents/'+P,{method:'PUT',body:JSON.stringify({message:'Update MangaGoAtlas ads configuration',content:enc(JSON.stringify(cfg,null,2)+'\n'),sha,branch:B})});sha=x.content.sha;$('msg').textContent='✓ Ads configuration saved. Public ads remain disabled unless you enable a section.'}catch(e){$('msg').textContent='Save failed: '+e.message}};$('reload').onclick=load;load()</script></body></html>
