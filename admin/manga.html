<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MangaGoAtlas Manga Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#aeb3c0;font-size:13px;margin:9px 0 5px}input,select,button{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit}button{background:#3f73c9;font-weight:700;cursor:pointer;width:auto}.secondary{background:#292e39}.danger{background:#a73535}.hidden{display:none}.item{border:1px solid #292e39;border-radius:9px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.muted{color:#aeb3c0;font-size:13px}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="chapters.html">📚 Chapters</a><a href="manga.html">📖 Manga</a><a href="ads.html">📢 Ads</a><a href="/">Open site</a></div><h1>📖 Manga Admin</h1><div id="login" class="panel"><h2>GitHub Admin Access</h2><input id="token" type="password" placeholder="GitHub token"><div class="actions" style="margin-top:10px"><button id="connect">Connect</button></div><div id="loginStatus" class="status"></div></div><main id="app" class="hidden"><div class="panel"><div class="actions"><button id="new">＋ Add manga</button><button id="logout" class="secondary">Forget token</button></div></div><div id="list" class="panel"></div><div id="editor" class="panel hidden"><h2 id="heading">Add manga</h2><div class="row"><div><label>Title</label><input id="title"></div><div><label>Slug</label><input id="slug"></div><div><label>Native title</label><input id="native"></div><div><label>Country</label><select id="country"><option value="JP">JP</option><option value="US">US</option><option value="FR">FR</option><option value="BR">BR</option></select></div></div><label>Cover image</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions" style="margin-top:12px"><button id="save">Save manga</button><button id="cancel" class="secondary">Cancel</button></div></div><div id="status" class="status"></div></main></div><script>'use strict';const KEY='mangogoatlas_github_token',O='MangaGoAtlas',R='MangaGoAtlas.github.io',B='main',PATH='data/content.json';let token=sessionStorage.getItem(KEY)||'',data={mangas:[],chapters:[]},sha='',editId=null;const $=id=>document.getElementById(id);function enc(s){const u=new TextEncoder().encode(s);let x='';for(let i=0;i<u.length;i+=32768)x+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(x)}function dec(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+path,{...opt,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch{}if(!r.ok)throw Error('GitHub '+r.status+': '+(x.message||text.slice(0,300)));return x}async function read(){const x=await api('/contents/'+PATH+'?ref='+B);sha=x.sha;data=JSON.parse(dec(x.content));data.mangas=data.mangas||[];data.chapters=data.chapters||[]}async function write(){const x=await api('/contents/'+PATH,{method:'PUT',body:JSON.stringify({message:editId?'Update manga':'Add manga',content:enc(JSON.stringify(data,null,2)+'\n'),sha,branch:B})});sha=x.content.sha}function render(){const a=data.mangas||[];$('list').innerHTML='<h2>'+a.length+' manga</h2>'+a.map(m=>'<div class="item"><div><b>'+esc(m.title)+'</b><br><span class="muted">'+esc(m.slug)+' · '+esc(m.native_title||'')+'</span></div><button class="secondary" onclick="editManga(\''+esc(m.id)+'\')">Edit</button></div>').join('')||'<p class="muted">No manga yet.</p>'}function reset(){editId=null;$('heading').textContent='Add manga';['title','slug','native'].forEach(x=>$(x).value='');$('country').value='JP';$('cover').value='';$('editor').classList.add('hidden')}window.editManga=id=>{const m=data.mangas.find(x=>x.id===id);if(!m)return;editId=id;$('heading').textContent='Edit manga';$('title').value=m.title||'';$('slug').value=m.slug||'';$('native').value=m.native_title||'';$('country').value=m.country||'JP';$('cover').value='';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})};$('new').onclick=()=>{$('editor').classList.remove('hidden');reset();$('editor').classList.remove('hidden')};$('cancel').onclick=reset;$('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};$('connect').onclick=async()=>{const t=$('token').value.trim();if(!t)return;$('loginStatus').textContent='Connecting to MangaGoAtlas/MangaGoAtlas.github.io…';token=t;try{await api('/contents/'+PATH+'?ref='+B);sessionStorage.setItem(KEY,token);location.reload()}catch(e){$('loginStatus').textContent='Connection failed: '+e.message}};$('save').onclick=async()=>{try{const title=$('title').value.trim(),slug=$('slug').value.trim();if(!title||!slug)throw Error('Title and slug are required.');await read();if(editId){const m=data.mangas.find(x=>x.id===editId);if(!m)throw Error('Manga not found.');Object.assign(m,{title,slug,native_title:$('native').value.trim(),country:$('country').value,updated_at:new Date().toISOString()})}else{const id=slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!id)throw Error('Use an English/Latin slug.');if(data.mangas.some(m=>m.id===id))throw Error('Manga already exists.');data.mangas.push({id,title,slug,native_title:$('native').value.trim(),country:$('country').value,language:$('country').value==='JP'?'ja':'en',cover:'',created_at:new Date().toISOString(),updated_at:new Date().toISOString()});editId=id}const f=$('cover').files[0];if(f){const path='manga-covers/'+slug.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const old=await api('/contents/'+path+'?ref='+B).catch(()=>null);const body={message:'Upload manga cover '+title,content:await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)}),branch:B};if(old?.sha)body.sha=old.sha;const r=await api('/contents/'+path,{method:'PUT',body:JSON.stringify(body)});data.mangas.find(m=>m.id===editId).cover=r.content.download_url||'https://raw.githubusercontent.com/'+O+'/'+R+'/'+B+'/'+path}await write();$('status').textContent='✓ Manga saved to MangaGoAtlas repository.';render();reset()}catch(e){$('status').textContent='Error: '+e.message}};async function boot(){if(!token)return;try{await read();$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}catch(e){$('loginStatus').textContent='Saved token is invalid or cannot access the MangaGoAtlas repository. Please reconnect.'}}boot();</script></body></html>
